name: build
on: [push, pull_request]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build
      - run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: minidaw
          path: build/Release/minidaw.exe
