name: build
on: [push, pull_request]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bauen und testen mit build.bat (wie auf dem eigenen Rechner)
        shell: cmd
        run: build.bat
      - name: Oberflaeche in ein Bild zeichnen
        shell: pwsh
        run: |
          $p = Start-Process -FilePath build\Release\minidaw.exe -ArgumentList '--screenshot','screenshot.png' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Screenshot fehlgeschlagen, Code $($p.ExitCode)" }
      - name: Bild als Text ins Protokoll schreiben (zum Pruefen ohne Download)
        shell: pwsh
        run: |
          $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes('screenshot.png'))
          Write-Output "PNGBEGIN"
          for ($i = 0; $i -lt $b.Length; $i += 200) { Write-Output ("PNG:" + $b.Substring($i, [Math]::Min(200, $b.Length - $i))) }
          Write-Output "PNGEND"
      - name: Pruefsumme der Programmdatei
        shell: pwsh
        run: |
          $h = (Get-FileHash build\Release\minidaw.exe -Algorithm SHA256).Hash
          Write-Output "SHA256 minidaw.exe: $h"
          "SHA-256 von minidaw.exe: ``$h``" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v6
        with:
          name: minidaw
          path: build/Release/minidaw.exe
      - uses: actions/upload-artifact@v6
        with:
          name: screenshot
          path: screenshot.png
