name: build
on: [push, pull_request]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bauen und testen mit build.bat (wie auf dem eigenen Rechner)
        shell: cmd
        run: build.bat
      - name: Oberflaeche in ein Bild zeichnen
        shell: pwsh
        run: |
          $p = Start-Process -FilePath build\Release\minidaw.exe -ArgumentList '--screenshot','screenshot.png' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Screenshot fehlgeschlagen, Code $($p.ExitCode)" }
          $p = Start-Process -FilePath build\Release\minidaw.exe -ArgumentList '--screenshot','mixer.png','mixer' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Mixer-Screenshot fehlgeschlagen, Code $($p.ExitCode)" }
          $p = Start-Process -FilePath build\Release\minidaw.exe -ArgumentList '--screenshot','eingang.png','eingang' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Eingangs-Screenshot fehlgeschlagen, Code $($p.ExitCode)" }
          foreach ($m in @('ladebild', 'ueber')) {
            $p = Start-Process -FilePath build\Release\minidaw.exe -ArgumentList '--screenshot',"$m.png",$m -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Screenshot $m fehlgeschlagen, Code $($p.ExitCode)" }
          }
      - name: Bild als Text ins Protokoll schreiben (zum Pruefen ohne Download)
        shell: pwsh
        run: |
          $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes('screenshot.png'))
          Write-Output "PNGBEGIN"
          for ($i = 0; $i -lt $b.Length; $i += 200) { Write-Output ("PNG:" + $b.Substring($i, [Math]::Min(200, $b.Length - $i))) }
          Write-Output "PNGEND"
          $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes('mixer.png'))
          Write-Output "MIXBEGIN"
          for ($i = 0; $i -lt $b.Length; $i += 200) { Write-Output ("MIX:" + $b.Substring($i, [Math]::Min(200, $b.Length - $i))) }
          Write-Output "MIXEND"
          $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes('eingang.png'))
          for ($i = 0; $i -lt $b.Length; $i += 200) { Write-Output ("INP:" + $b.Substring($i, [Math]::Min(200, $b.Length - $i))) }
          $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes('ladebild.png'))
          for ($i = 0; $i -lt $b.Length; $i += 200) { Write-Output ("SPL:" + $b.Substring($i, [Math]::Min(200, $b.Length - $i))) }
          $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes('ueber.png'))
          for ($i = 0; $i -lt $b.Length; $i += 200) { Write-Output ("ABT:" + $b.Substring($i, [Math]::Min(200, $b.Length - $i))) }
      - name: Pruefsumme der Programmdatei
        shell: pwsh
        run: |
          $h = (Get-FileHash build\Release\minidaw.exe -Algorithm SHA256).Hash
          Write-Output "SHA256 minidaw.exe: $h"
          "SHA-256 von minidaw.exe: ``$h``" >> $env:GITHUB_STEP_SUMMARY
          # Liegt eine fertige exe im Repository, muss sie genau diesem Build entsprechen.
          if (Test-Path bin\minidaw.exe) {
            $c = (Get-FileHash bin\minidaw.exe -Algorithm SHA256).Hash
            if ($c -eq $h) { Write-Output "bin\minidaw.exe entspricht dem Quellcode." }
            else { Write-Output "::warning::bin\minidaw.exe ist veraltet (im Repository: $c, aus dem Quellcode: $h)" }
          }
      - uses: actions/upload-artifact@v6
        with:
          name: minidaw
          path: build/Release/minidaw.exe
      - uses: actions/upload-artifact@v6
        with:
          name: screenshot
          path: |
            screenshot.png
            mixer.png
            eingang.png
            ladebild.png
            ueber.png
